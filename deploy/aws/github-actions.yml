AWSTemplateFormatVersion: '2010-09-09'
Description: >
  GitHub Actions -> AWS via OIDC (no stored keys). One role per repo, each limited to deploying that repo,
  and only from jobs that use the GitHub environment "production".

Parameters:
  GitHubOrg:
    Type: String
    Default: kofeko-development
  BackendRepo:
    Type: String
    Default: kofeko-backend
  FrontendRepo:
    Type: String
    Default: kofeko-app
  StackName:
    Type: String
    Default: kofeko

Resources:
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  BackendDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kofeko-github-backend-deploy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidc }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOrg}/${BackendRepo}:environment:production'
      Policies:
        - PolicyName: deploy-backend
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/kofeko-backend'
              # Update only the kofeko stack, which in turn only needs to roll the ECS task/service
              - Effect: Allow
                Action:
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackName}/*'
              - Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeServices
                  - ecs:UpdateService
                  - ecs:TagResource
                  - ssm:GetParameters
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${StackName}-*'
                Condition:
                  StringEquals: { iam:PassedToService: ecs-tasks.amazonaws.com }

  FrontendDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kofeko-github-frontend-deploy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidc }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOrg}/${FrontendRepo}:environment:production'
      Policies:
        - PolicyName: deploy-frontend
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [amplify:StartJob, amplify:GetJob, amplify:ListJobs, amplify:GetApp]
                Resource: !Sub 'arn:aws:amplify:${AWS::Region}:${AWS::AccountId}:apps/*'

Outputs:
  BackendRoleArn:
    Value: !GetAtt BackendDeployRole.Arn
  FrontendRoleArn:
    Value: !GetAtt FrontendDeployRole.Arn
