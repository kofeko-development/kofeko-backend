name: Deploy backend (AWS ECS)

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of cancelling it mid-rollout
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # OIDC login to AWS, no stored keys
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::396535943194:role/kofeko-github-backend-deploy
  ECR_REPOSITORY: kofeko-backend
  STACK_NAME: kofeko

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.kofeko.com/health
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The ECS host is ARM (t4g); build the arm64 image under QEMU
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll ECS service to the new image
        run: |
          params=""
          for key in ApiDomain AppSecretArn DbPassword FilesBucket DesiredCount InstanceType DbInstanceClass DbDeletionProtection EcsAmi; do
            params="$params ParameterKey=$key,UsePreviousValue=true"
          done
          set +e
          out=$(aws cloudformation update-stack --stack-name "$STACK_NAME" --use-previous-template \
            --capabilities CAPABILITY_IAM \
            --parameters ParameterKey=ImageTag,ParameterValue=${{ github.sha }} $params 2>&1)
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            if echo "$out" | grep -q "No updates are to be performed"; then
              echo "This commit is already deployed."; exit 0
            fi
            echo "$out"; exit $code
          fi
          echo "Waiting for ECS to start the new task (old one stops first, ~1-3 min)..."
          if ! aws cloudformation wait stack-update-complete --stack-name "$STACK_NAME"; then
            aws cloudformation describe-stack-events --stack-name "$STACK_NAME" --max-items 15 \
              --query "StackEvents[].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" --output table
            exit 1
          fi

      - name: Service status
        if: always()
        run: |
          aws ecs describe-services --cluster kofeko --services kofeko-api \
            --query "services[0].{running:runningCount,desired:desiredCount,taskDefinition:taskDefinition,events:events[0:5].message}" --output yaml

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://api.kofeko.com/health; then echo; echo "Healthy"; exit 0; fi
            sleep 10
          done
          echo "Health check failed (logs: CloudWatch log group /kofeko/backend)"; exit 1
